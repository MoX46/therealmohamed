name: Deploy to GitHub Pages

on:
  # Rebuild the site every time something is pushed to main
  push:
    branches: [main]
  # Rebuild once a day to pick up changes on Goodreads (06:00 Pacific)
  schedule:
    - cron: '0 13 * * *'
  # Allow a manual rebuild from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          # Build from scratch every time. Astro's cache only notices a post changing, so a chart
          # whose CSV file changed would keep its old drawing.
          cache: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
